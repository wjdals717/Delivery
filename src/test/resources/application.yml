# 테스트 전용 설정: PostgreSQL 대신 메모리 DB(H2)를 쓴다
spring:
  datasource:
    url: jdbc:h2:mem:delivery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

admin:
  token: test-admin-token

jwt:
  secret:
    # 테스트용 키 (Base64, 32바이트 이상). 실제 키는 GitHub 에 올리지 않는다
    key: dGVzdC1zZWNyZXQta2V5LWZvci1kZWxpdmVyeS1qd3QtdGVzdHMtb25seQ==
  expiration-ms: 3600000
